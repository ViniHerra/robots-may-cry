* { box-sizing:border-box; margin:0; }
/* mismo fondo que el sitio: papel */
body { background:#E8EAE6; padding:20px; font-family:Georgia,serif;
    display:flex; align-items:center; justify-content:center; min-height:100vh; }
:root { --tinta:#1C2024; --acento:#C8541F; }

.arte {
    font-family:'Muthur','Courier New',monospace;
    color:var(--tinta); font-size:16px; line-height:1.25;
    white-space:pre; display:inline-block; text-align:left;
}
.arte .lagrima { color:var(--acento); }
</style>

<body>
<div class="arte" id="arte"></div>

<script>
const ARTE = "     .-=========-.\n     |  [o]  [o] |\n     |  T        |\n     |    ___    |\n     |   |   |   |\n     '-==|===|==-'\n        ||   ||\n    .==#=======#==.\n   //  _________  \\\\\n  ||   | R M C |   ||\n  ||   |  #####|   ||\n  ||   |_|###|_|   ||\n   \\\\   #########  //\n    '==#=======#=='\n        ||   ||\n       _||_ _||_";
const VEL = 18;
const elA=document.getElementById('arte');
let t=null;
function pintar(){
    elA.innerHTML=''; let i=0;
    function paso(){
        if(i>=ARTE.length) return;
        const ch=ARTE[i];
        if(ch==='T'){const s=document.createElement('span');s.className='lagrima';s.textContent="'";elA.appendChild(s);}
        else{elA.appendChild(document.createTextNode(ch));}
        i++; t=setTimeout(paso, VEL);
    }
    paso();
}
pintar();
</script>
