{% extends "base.html" %}
{% block title %}{{ category }} — {{ SITENAME }}{% endblock title %}
{% block content %}
<section class="hero hero-compact">
    <p class="eyebrow">CATEGORÍA</p>
    <h1 class="hero-title">{{ category }}</h1>
</section>
<section class="archive-list">
    {% for article in articles %}
    <a class="archive-row" href="{{ SITEURL }}/{{ article.url }}">
        <span class="archive-date">{{ article.date.strftime('%Y.%m.%d') }}</span>
        <span class="archive-title">{{ article.title }}</span>
    </a>
    {% endfor %}
</section>
{% endblock content %}
