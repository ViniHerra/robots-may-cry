<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ SITENAME }}{% endblock title %}</title>
    <meta name="description" content="{{ SITESUBTITLE }}" />
    <meta property="og:image" content="{{ SITEURL }}/theme/images/pieta-social.jpg">
    <meta property="og:title" content="{{ SITENAME }}">
    <meta property="og:description" content="{{ SITESUBTITLE }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css" />
    {% if FEED_ALL_ATOM %}
    <link href="{{ FEED_DOMAIN }}/{{ FEED_ALL_ATOM }}" type="application/atom+xml" rel="alternate" title="{{ SITENAME }}" />
    {% endif %}
</head>
<body>
    <div class="page">
        <header class="site-header">
            <a class="brand" href="{{ SITEURL }}/">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 48 48" width="26" height="26">
                        <circle cx="24" cy="24" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
                        <path d="M24 4 L24 13 M24 35 L24 44 M4 24 L13 24 M35 24 L44 24" stroke="currentColor" stroke-width="2"/>
                        <circle cx="24" cy="20" r="1.6" fill="currentColor"/>
                        <path d="M20 28 Q24 32 28 28" stroke="#C8541F" stroke-width="2" fill="none" stroke-linecap="round"/>
                    </svg>
                </span>
                <span class="brand-name">{{ SITENAME }}</span>
            </a>
            <nav class="site-nav">
                {% for title, link in MENUITEMS %}<a href="{{ SITEURL }}{{ link }}">{{ title }}</a>{% endfor %}
            </nav>
        </header>

        <div class="circuit-trace" aria-hidden="true"></div>

        <main class="site-main">
            {% block content %}{% endblock content %}
        </main>

        <div class="circuit-trace" aria-hidden="true"></div>

        <footer class="site-footer">
            <p>&copy; {{ SITENAME }} — construido con Pelican.</p>
        </footer>
    </div>
</body>
</html>
