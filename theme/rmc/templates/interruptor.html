{# Interruptor de luz: cambia entre modo noche y modo día. Lo controla theme/js/interruptor.js #}
<button class="sw-luz" id="swLuz" type="button" role="switch" aria-checked="false" aria-label="Luz de lectura: día o noche" title="Luz de lectura">
  <svg viewBox="0 0 60 112" aria-hidden="true">
            <defs>
              <linearGradient id="sw-anod" x1="0" y1="0" x2=".35" y2="1"><stop offset="0" stop-color="#4b5159"/><stop offset=".5" stop-color="#2a2e34"/><stop offset="1" stop-color="#191c20"/></linearGradient>
              <linearGradient id="sw-bisel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a9099"/><stop offset=".12" stop-color="#3a3f46"/><stop offset="1" stop-color="#0d0f12"/></linearGradient>
              <radialGradient id="sw-tornillo" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#e2e5e9"/><stop offset=".55" stop-color="#7a8088"/><stop offset="1" stop-color="#33373c"/></radialGradient>
              <linearGradient id="sw-tuerca" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d9dde2"/><stop offset=".45" stop-color="#7d838b"/><stop offset="1" stop-color="#2c3035"/></linearGradient>
              <radialGradient id="sw-buje" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#b8bdc4"/><stop offset=".6" stop-color="#555a61"/><stop offset="1" stop-color="#1e2125"/></radialGradient>
              <linearGradient id="sw-cromo" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6b7078"/><stop offset=".3" stop-color="#f6f7f9"/><stop offset=".45" stop-color="#c3c7cd"/><stop offset=".75" stop-color="#8b9098"/><stop offset="1" stop-color="#4c5056"/></linearGradient>
              <radialGradient id="sw-bola" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#d4d8dd"/><stop offset="1" stop-color="#5d6269"/></radialGradient>
              <radialGradient id="sw-jOff" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#6a1c24"/><stop offset="1" stop-color="#2a0a0e"/></radialGradient>
              <radialGradient id="sw-jOn" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffd4d8"/><stop offset=".35" stop-color="#ff3a4c"/><stop offset="1" stop-color="#a50f1e"/></radialGradient>
              <filter id="sw-sombra" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
              <filter id="sw-halo" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="3.5"/></filter>
            </defs>
            <!-- placa con bisel -->
            <rect class="plate" x="1" y="1" width="58" height="110" rx="8" fill="url(#sw-bisel)"/>
            <rect x="2.5" y="2.5" width="55" height="107" rx="7" fill="url(#sw-anod)"/>
            <!-- tornillos -->
            <g><circle cx="30" cy="8.5" r="3" fill="url(#sw-tornillo)"/><path d="M28 8.5h4M30 6.5v4" stroke="#2a2d31" stroke-width=".8"/></g>
            <g><circle cx="30" cy="103.5" r="3" fill="url(#sw-tornillo)"/><path d="M28 103.5h4M30 101.5v4" stroke="#2a2d31" stroke-width=".8"/></g>
            <!-- piloto tipo joya -->
            <circle cx="30" cy="19" r="5.2" fill="#0c0e11"/><circle cx="30" cy="19" r="4.2" fill="url(#sw-jOff)"/>
            <g class="lamp-on"><circle cx="30" cy="19" r="7" fill="#ff2a3c" opacity=".55" filter="url(#sw-halo)"/><circle cx="30" cy="19" r="4.2" fill="url(#sw-jOn)"/></g>
            <circle cx="28.6" cy="17.6" r="1.1" fill="#fff" opacity=".55"/>
            <!-- grabados -->
            <text class="eng eng-light" x="30" y="33.6">DÍA</text><text class="eng eng-dark" x="30" y="33">DÍA</text><text class="eng eng-act dia" x="30" y="33">DÍA</text>
            <text class="eng eng-light" x="30" y="96.6">NOCHE</text><text class="eng eng-dark" x="30" y="96">NOCHE</text><text class="eng eng-act noche" x="30" y="96">NOCHE</text>
            <!-- tuerca hexagonal y buje -->
            <polygon points="30,56.5 39,61.7 39,72.3 30,77.5 21,72.3 21,61.7" fill="url(#sw-tuerca)" stroke="#1a1d21" stroke-width=".6"/>
            <circle cx="30" cy="67" r="6.6" fill="url(#sw-buje)" stroke="#16181b" stroke-width=".6"/>
            <!-- sombra de la palanca -->
            <g class="lever-shadow" opacity=".55" filter="url(#sw-sombra)"><path d="M27.8 67 L26.8 51 Q30 46.5 33.2 51 L32.2 67 Z" fill="#000"/><circle cx="30" cy="48" r="5" fill="#000"/></g>
            <!-- palanca cromada -->
            <g class="lever">
              <path d="M27.8 67 L26.9 51.5 Q30 47.5 33.1 51.5 L32.2 67 Z" fill="url(#sw-cromo)" stroke="#3d4147" stroke-width=".4"/>
              <circle cx="30" cy="48.2" r="4.8" fill="url(#sw-bola)" stroke="#3d4147" stroke-width=".4"/>
              <circle cx="30" cy="67" r="2.8" fill="#2a2d31"/>
            </g>
          </svg>
</button>
